services:
  controller:
    build: .
    env_file:
      - apps/controller/.env
    environment:
      CONTROLLER_HOST: 0.0.0.0
      CONTROLLER_PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      - postgres
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
