services:
  controller:
    build: .
    env_file:
      - apps/controller/.env
    environment:
      CONTROLLER_HOST: 0.0.0.0
      CONTROLLER_PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/api/settings').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  sample:
    build:
      context: .
      dockerfile: apps/sample/Dockerfile
    environment:
      DEPENDENCY_URL: http://dependency:4100
    ports:
      - "3000:3000"
    depends_on:
      dependency:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  dependency:
    build: apps/dependency
    environment:
      DEMO_DEP_DOWN: "0"
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
